[package]
name = "roystudio-desktop"
version = "1.0.2"
description = "RoyStudio Desktop IDE for RoyLang"
edition = "2021"

[lib]
name = "roystudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "roystudio-desktop"
path = "src/main.rs"

[[bin]]
name = "roy-runner"
path = "src/runner.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.57"
flate2 = "1"
crc32fast = "1"
base64 = "0.23"
ico = "0.6"
